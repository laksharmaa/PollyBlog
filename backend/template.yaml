AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Blog platform backend (auth, blogs, text-to-speech) - migrated from
  Serverless Framework to AWS SAM.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  JwtSecret:
    Type: String
    NoEcho: true
    Description: >
      Secret used to sign/verify JWTs. Pass this at deploy time
      (see samconfig.toml / --parameter-overrides). Never commit the real
      value to git. Generate one with: openssl rand -base64 48
  SmtpHost:
    Type: String
    Default: smtp.gmail.com
  SmtpPort:
    Type: String
    Default: '587'
  SmtpSecure:
    Type: String
    Default: 'false'
  SmtpUser:
    Type: String
    Default: ''
  SmtpPassword:
    Type: String
    NoEcho: true
    Default: ''
  EmailFrom:
    Type: String
    Default: ''
  FrontendUrl:
    Type: String
    Default: 'http://localhost:5173'

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        JWT_SECRET: !Ref JwtSecret
        SMTP_HOST: !Ref SmtpHost
        SMTP_PORT: !Ref SmtpPort
        SMTP_SECURE: !Ref SmtpSecure
        SMTP_USER: !Ref SmtpUser
        SMTP_PASSWORD: !Ref SmtpPassword
        EMAIL_FROM: !Ref EmailFrom
        FRONTEND_URL: !Ref FrontendUrl
        USERS_TABLE: !Ref UsersTable
        BLOGS_TABLE: !Ref BlogsTable
        SAVED_BLOGS_TABLE: !Ref SavedBlogsTable
        REFRESH_TOKENS_TABLE: !Ref RefreshTokensTable
        AUTH_ACTIONS_TABLE: !Ref AuthActionsTable
        S3_BUCKET_NAME: !Ref AudioBucket

Resources:
  # ---------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]   # tighten to your frontend's domain before going to real prod
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]

  # ---------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------
  RegisterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/register.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/register.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthActionsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /register
            Method: POST

  LoginFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/login.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/login.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:DeleteItem
              Resource: !GetAtt RefreshTokensTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /login
            Method: POST

  RefreshFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/refresh.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/refresh.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:DeleteItem
              Resource: !GetAtt RefreshTokensTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /refresh
            Method: POST

  LogoutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/logout.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/logout.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt RefreshTokensTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /logout
            Method: POST

  VerifyEmailFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/verifyEmail.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/verifyEmail.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthActionsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /verify-email
            Method: POST

  ResendVerificationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/resendVerification.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/resendVerification.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthActionsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /resend-verification
            Method: POST

  ForgotPasswordFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/forgotPassword.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/forgotPassword.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthActionsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /forgot-password
            Method: POST

  ResetPasswordFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/auth/resetPassword.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/auth/resetPassword.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AuthActionsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /reset-password
            Method: POST

  # ---------------------------------------------------------------------
  # Blogs
  # ---------------------------------------------------------------------
  CreateBlogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/create.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/create-blog
            Method: POST

  SaveBlogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/save.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/save.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedBlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/save-blog
            Method: POST

  ListBlogsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/list.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SavedBlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/get-blogs
            Method: GET

  GetBlogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/get.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SavedBlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/get-blog/{blogId}
            Method: GET

  DeleteBlogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/delete.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/delete.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/blogs/{blogId}
            Method: DELETE

  ListOwnedBlogsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/listOwned.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/listOwned.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/my-blogs
            Method: GET

  UpdateBlogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/update.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/update.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/blogs/{blogId}
            Method: PUT

  ListPublicBlogsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/listPublic.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/listPublic.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/public-blogs
            Method: GET

  GetPublicBlogFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/blog/getPublic.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/blog/getPublic.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BlogsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/public-blog/{blogId}
            Method: GET

  # ---------------------------------------------------------------------
  # Speech (Polly + S3)
  # ---------------------------------------------------------------------
  SpeechFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        EntryPoints: [src/handlers/speech/synthesize.js]
    Properties:
      CodeUri: .
      Handler: src/handlers/speech/synthesize.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
        - S3CrudPolicy:
            BucketName: !Ref AudioBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/speech
            Method: POST

  # ---------------------------------------------------------------------
  # Data stores (now real infrastructure-as-code, not click-ops)
  # ---------------------------------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuthActionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-AuthActions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S
      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Public/community blogs. PK+SK lets a user have many blogs; the two GSIs
  # support "all public blogs" and "look up one blog by id regardless of
  # owner", matching how the handlers query it.
  BlogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Blogs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
        - AttributeName: blogId
          AttributeType: S
        - AttributeName: isPublic
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
        - AttributeName: blogId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: isPublic-index
          KeySchema:
            - AttributeName: isPublic
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: blogId-index
          KeySchema:
            - AttributeName: blogId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # Private saved drafts, one per user+blogId.
  SavedBlogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-SavedBlogs"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
        - AttributeName: blogId
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
        - AttributeName: blogId
          KeyType: RANGE

  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-RefreshTokens"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tokenId
          AttributeType: S
      KeySchema:
        - AttributeName: tokenId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-audiofiles-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGeneratedAudio
            Status: Enabled
            ExpirationInDays: 30   # cached TTS mp3s regenerate cheaply; no need to keep forever

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UsersTableName:
    Value: !Ref UsersTable
  BlogsTableName:
    Value: !Ref BlogsTable
  SavedBlogsTableName:
    Value: !Ref SavedBlogsTable
  RefreshTokensTableName:
    Value: !Ref RefreshTokensTable
  AudioBucketName:
    Value: !Ref AudioBucket
